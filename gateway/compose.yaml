services:
  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8767:8767"
    volumes:
      - papercolor-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  papercolor-data:
